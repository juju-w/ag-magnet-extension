<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="title" id="animeTitle">Anime Garden 磁力批量复制</div>
    <div class="sub" id="statusLine">读取中…</div>
  </header>

  <main id="main" hidden>
    <section class="block">
      <div class="block-label-row">
        <span class="block-label">字幕组 / 翻译组</span>
        <span class="mini-actions">
          <button class="link-btn" id="fansubAll">全选</button>
          <button class="link-btn" id="fansubNone">取消</button>
        </span>
      </div>
      <div class="chips" id="fansubChips"></div>
    </section>

    <section class="block">
      <div class="block-label-row">
        <span class="block-label">集数 <span class="hint">（点击切换；按住拖动可框选多集）</span></span>
        <label class="num" title="长篇番绝对集号归并：相对集 = 集号 − 偏移（自动识别，可改）">偏移<input type="number" id="offset" value="0" min="0" /></label>
      </div>
      <div class="chips" id="episodeChips"></div>
    </section>

    <section class="block">
      <div class="block-label-row">
        <span class="block-label">资源列表</span>
        <input type="search" id="keyword" placeholder="关键词过滤，如 Baha / 简体 / 1080" />
      </div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <div class="empty" id="empty" hidden></div>

  <footer id="footer" hidden>
    <div class="footer-actions">
      <button class="ghost" id="selectAll">全选</button>
      <button class="ghost" id="clearAll">清空</button>
    </div>
    <button class="primary" id="copyBtn" disabled>复制选中磁力 (0)</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
